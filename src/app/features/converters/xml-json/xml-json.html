<div class="tool">
  <app-tool-header
    title="XML ↔ JSON"
    description="Convert XML and JSON locally with readable output."
  />
  <div class="workbench">
    <section class="panel">
      <div class="panel-label"><label for="xml-input">Input</label></div>
      <textarea
        id="xml-input"
        class="code-area"
        [(ngModel)]="input"
        placeholder="Paste XML or JSON here..."
        spellcheck="false"
      ></textarea>
      <div class="actions">
        <button class="primary" type="button" (click)="convert('xml')">XML to JSON</button>
        <button class="secondary" type="button" (click)="convert('json')">JSON to XML</button>
        <button class="quiet" type="button" (click)="clear()">Clear</button>
      </div>
      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }
    </section>
    <section class="panel">
      <div class="panel-label">
        <span>Output</span>
        @if (output) {
          <app-copy-button [text]="output" />
        }
      </div>
      <pre class="code-area output">{{ output || 'Converted content will appear here.' }}</pre>
    </section>
  </div>
</div>
