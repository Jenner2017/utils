<div class="tool">
  <app-tool-header
    title="JSON Formatter"
    description="Format, validate and minify JSON locally in your browser."
  />
  <div class="workbench">
    <section class="panel">
      <div class="panel-label">
        <label for="json-input">Input</label><span class="hint">Paste your JSON here</span>
      </div>
      <textarea
        id="json-input"
        class="code-area"
        [(ngModel)]="input"
        placeholder='{"name":"Carlos","developer":true}'
        spellcheck="false"
      ></textarea>
      <div class="actions">
        <button class="primary" type="button" (click)="format()">Format JSON</button
        ><button class="secondary" type="button" (click)="format(true)">Minify</button
        ><button class="quiet" type="button" (click)="clear()">Clear</button>
      </div>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
    </section>
    <section class="panel">
      <div class="panel-label">
        <span>Output</span>
        @if (output()) {
          <app-copy-button [text]="output()" />
        }
      </div>
      <pre class="code-area output">{{ output() || 'Formatted JSON will appear here.' }}</pre>
    </section>
  </div>
</div>
