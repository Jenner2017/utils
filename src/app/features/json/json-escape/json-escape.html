<div class="tool">
  <app-tool-header
    title="JSON Escape"
    description="Escape and unescape JSON string content without leaving your browser."
  />
  <div class="workbench">
    <section class="panel">
      <div class="panel-label"><label for="escape-input">Input</label></div>
      <textarea
        id="escape-input"
        class="code-area"
        [(ngModel)]="input"
        placeholder="Paste text or escaped JSON here..."
        spellcheck="false"
      ></textarea>
      <div class="actions">
        <button class="primary" type="button" (click)="escape()">Escape</button
        ><button class="secondary" type="button" (click)="unescape()">Unescape</button
        ><button class="quiet" type="button" (click)="clear()">Clear</button>
      </div>
      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }
    </section>
    <section class="panel">
      <div class="panel-label">
        <span>Output</span>
        @if (output) {
          <app-copy-button [text]="output" />
        }
      </div>
      <pre class="code-area output">{{ output || 'Result will appear here.' }}</pre>
    </section>
  </div>
</div>
